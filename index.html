<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Celia</title>

<style>

body{
    margin:0;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#mensaje{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:50px;
    color:white;
    text-align:center;
    font-weight:bold;
}

.tarta{
    position:relative;
    width:300px;
    height:300px;
    cursor:pointer;
}

/* Piso inferior */
.abajo{
    position:absolute;
    bottom:0;
    width:300px;
    height:120px;
    background:#ff4d79;
    border-radius:20px;
}

/* Piso superior */
.arriba{
    position:absolute;
    bottom:100px;
    left:50px;
    width:200px;
    height:80px;
    background:#ffc0cb;
    border-radius:20px;
}

/* Velas */
.vela{
    position:absolute;
    width:12px;
    height:50px;
    background:white;
    bottom:180px;
}

.v1{left:70px;}
.v2{left:144px;}
.v3{left:218px;}

.llama{
    position:absolute;
    width:15px;
    height:20px;
    background:gold;
    border-radius:50%;
    top:-18px;
}

</style>
</head>

<body>

<div id="mensaje">
🎉<br>
FELIZ CUMPLEAÑOS<br>
CELIA<br>
🎂❤️
</div>

<div class="tarta" id="tarta">

    <div class="arriba"></div>

    <div class="abajo"></div>

    <div class="vela v1">
        <div class="llama"></div>
    </div>

    <div class="vela v2">
        <div class="llama"></div>
    </div>

    <div class="vela v3">
        <div class="llama"></div>
    </div>

</div>

<script>

document.getElementById("tarta").onclick=function(){

    document.getElementById("tarta").style.display="none";

    document.getElementById("mensaje").style.display="block";

};

</script>

</body>
</html>
